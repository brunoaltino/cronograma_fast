<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6cbf4a">
  <title>Cronograma Banestes 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="w">
    <header class="hd">
      <div>
        <h1>🍊 Cronograma Banestes 2026</h1>
        <small>Técnico Bancário, prova em 24/01/2027 (FCC)</small>
      </div>
      <div>
        <div class="cd" id="cd">--</div>
        <small>dias para a prova</small>
      </div>
      <div>
        <small>Início do plano</small><br>
        <input type="date" id="st">
      </div>
    </header>

    <!-- TELA DE LOGIN / CADASTRO -->
    <section id="authView" class="authbox card hide">
      <h2 style="margin-top:0">🔐 Acesso ao cronograma</h2>
      <p class="mut">Entre com sua conta para sincronizar seus estudos e participar do ranking.</p>
      <label for="aemail">E-mail</label>
      <input type="email" id="aemail" placeholder="seu@email.com" autocomplete="email">
      <label for="apass">Senha</label>
      <input type="password" id="apass" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
      <div class="row" style="margin-top:14px">
        <button class="btn p" id="btnLogin">Entrar</button>
        <button class="btn" id="btnSignup">Criar conta</button>
      </div>
      <div id="amsg" class="msg hide"></div>
    </section>

    <!-- APP PRINCIPAL -->
    <main id="appView" class="hide">
      <div class="syncbar">
        <div class="grp">
          <span class="dot" id="sdot"></span>
          <span id="stxt">Conectando...</span>
        </div>
        <div class="grp">
          <span id="uemail" class="mut"></span>
          <button class="btn sm" id="spull">Sincronizar</button>
          <button class="btn sm" id="btnLogout">Sair</button>
        </div>
      </div>

      <nav class="tabs" id="navTabs">
        <button data-t="a" class="on">📅 Cronograma</button>
        <button data-t="b">📊 Desempenho</button>
        <button data-t="d">🎯 Simulador</button>
        <button data-t="e">🧠 Erros &amp; Revisões</button>
        <button data-t="c">📝 Registro</button>
        <button data-t="f">🏆 Ranking</button>
      </nav>

      <section id="a"></section>
      <section id="b" class="hide"></section>
      <section id="d" class="hide"></section>
      <section id="e" class="hide"></section>
      <section id="c" class="hide"></section>
      <section id="f" class="hide"></section>
    </main>
  </div>

  <div class="ov" id="ov"><div class="md" id="md"></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
